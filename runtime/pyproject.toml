[project]
name = "decktation-runtime"
version = "0.1.0"
description = "Packaged runtime for Decktation's backend bridge"
requires-python = "==3.11.*"
dependencies = [
  "faster-whisper==1.2.1",
  "numpy==2.4.2",
  "onnxruntime==1.24.1",
]

[project.scripts]
decktation-runtime = "decktation_runtime.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

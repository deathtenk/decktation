name: Build Decktation Plugin

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [master, main]
  delete:
  release:
    types: [created]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node scripts/release-version.mjs check
      - run: pip install pytest sentry-sdk==2.66.0
      - run: pytest tests/ -v
      - run: python -m py_compile main.py runtime_client.py wow_voice_chat.py controller_listener.py deck_hid.py telemetry.py runtime/runtime_entry.py runtime/src/decktation_runtime/*.py

  build:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          node scripts/release-version.mjs check "$RELEASE_TAG"

      - name: Download Decky CLI
        run: |
          curl -fL -o /tmp/decky-cli \
            https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.7/decky-linux-x86_64
          chmod +x /tmp/decky-cli

      - name: Prepare backend build context
        run: bash backend/prepare-build-context.sh

      - name: Build packaged runtime artifact
        run: make runtime-build

      - name: Validate packaged runtime artifact
        run: |
          test -x backend/out/decktation-runtime
          test -f backend/out/lib/libportaudio.so.2
          test -f backend/out/licenses/ydotool-AGPL-3.0.txt
          test -f backend/out/licenses/portaudio-MIT.txt

      - name: Build marketplace artifact
        run: sudo /tmp/decky-cli plugin build -b -t /tmp/decktation-decky-build -o build-output -s directory .

      - name: Validate artifact
        run: |
          unzip -t build-output/decktation.zip
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/decktation-runtime'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/lib/libportaudio.so.2'
          unzip -l build-output/decktation.zip | grep -q 'decktation/telemetry.py'
          unzip -l build-output/decktation.zip | grep -q 'decktation/runtime_client.py'
          unzip -l build-output/decktation.zip | grep -q 'decktation/game_presets.json'
          unzip -l build-output/decktation.zip | grep -q 'decktation/channel_languages.json'

      - name: Upload CI build as a direct file
        uses: actions/upload-artifact@v7
        with:
          path: build-output/decktation.zip
          archive: false

      - name: Upload release archive
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/decktation.zip
          body: |
            ## Installation

            Download **decktation.zip** from the Assets section and import it
            with Decky's **Install Plugin from ZIP** option.

            **Do not download “Source code (zip)” or “Source code (tar.gz)”.**
            GitHub adds those archives automatically, but they do not contain
            Decktation's bundled Python dependencies and will not run.
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish Pages downloads
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: bash scripts/publish-pages.sh

  cleanup-pages:
    if: github.event_name == 'delete'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prune deleted branch downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          CLEANUP_ONLY: "true"
        run: bash scripts/publish-pages.sh
